name: Test - Build - Version and Deploy

on:
  push:
    branches:
      - master
  # Manual recovery for when git tags/releases were created but the npm publish
  # step failed. npm trusted publishing accepts a single workflow file per
  # package, so recovery lives here rather than in its own workflow.
  workflow_dispatch:
    inputs:
      from_package:
        description: 'Publish versions declared in package.json that npm does not have yet (lerna publish from-package)'
        type: boolean
        default: true

# releases push version commits and tags to master: never run two at once,
# and never cancel one halfway through a publish
concurrency:
  group: release
  cancel-in-progress: false

jobs:

  Build_Test_Lint_Deploy:
    runs-on: ubuntu-latest
    permissions:
      # push the version commit/tags and create GitHub releases
      contents: write
      # npm trusted publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # lerna needs the full history and tags to compute versions
          fetch-depth: 0

      - name: Set git user
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install
        run: npm ci

      - name: Build
        # dependents need their dependencies' lib/ output, so build before testing
        run: npm run build:ci

      - name: Lint
        run: npm run lint:ci

      - name: Test
        run: npm run test:ci

      - name: Publish_from_package
        if: github.event_name == 'workflow_dispatch' && inputs.from_package
        # No --create-release: the GitHub releases/tags already exist from the
        # failed run; only the npm publish is outstanding.
        run: npx lerna publish from-package -y --no-private --loglevel verbose

      - name: Version_and_Deploy
        if: github.event_name == 'push'
        # lerna publish --conventional-commits; npm auth is via trusted publishing (OIDC), no NPM_TOKEN
        run: npm run deploy:ci
        env:
          GH_TOKEN: ${{ github.token }}
