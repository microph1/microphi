name: Pull Request Checks

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

# a new push to the same PR supersedes the previous run
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          # full history: affected packages are computed against the merge base with master
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Select packages
        # Only packages changed since master, plus their dependents (tests) and
        # dependencies (build). Anything changed outside packages/ (root config,
        # lockfile, workflows) can affect every package, so it runs them all.
        run: |
          git fetch --no-tags origin master
          if git diff --name-only origin/master...HEAD | grep -qv '^packages/'; then
            echo "FILTER=" >> "$GITHUB_ENV"
          else
            echo "FILTER=--since origin/master --include-dependents --include-dependencies" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: npx lerna run build:ci --stream $FILTER

      - name: Test
        run: npx lerna run test:ci --stream $FILTER

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:ci
